<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if page.title %}{{ page.title }} | Furkan Canturk{% else %}Furkan Canturk | Unity Gameplay Systems Designer and Programmer{% endif %}</title>
    <meta name="description" content="{{ page.description | default: 'Unity gameplay systems designer and programmer. Networked multiplayer, AI behaviour, and simulation systems. 14+ shipped games and projects, and published Unity Asset Store packages.' }}">
    <meta name="author" content="Furkan Canturk">
    <meta name="theme-color" content="#0f0f0f">
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <!-- Open Graph -->
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="Furkan Canturk">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | Furkan Canturk{% else %}Furkan Canturk | Unity Gameplay Systems Designer and Programmer{% endif %}">
    <meta property="og:description" content="{{ page.description | default: 'Networked multiplayer, AI behaviour, and simulation systems. 14+ shipped games and projects, published Unity Asset Store packages, and a gamified fitness system on Amazon.' }}">
    <meta property="og:image" content="{{ page.image | default: '/Banner.png' | absolute_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="480">
    <meta property="og:image:alt" content="Furkan Canturk, Unity gameplay systems programmer">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} | Furkan Canturk{% else %}Furkan Canturk | Unity Gameplay Systems Designer and Programmer{% endif %}">
    <meta name="twitter:description" content="{{ page.description | default: 'Networked multiplayer, AI behaviour, and simulation systems. 14+ shipped games and projects, and published Unity Asset Store packages.' }}">
    <meta name="twitter:image" content="{{ page.image | default: '/Banner.png' | absolute_url }}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/assets/css/site.css">
</head>

<body>

{% include header.html %}

{{ content }}

{% include footer.html %}
</body>

</html>

<script src="/assets/js/site.js"></script>
